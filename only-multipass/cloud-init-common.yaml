#cloud-config
package_update: true
package_upgrade: true

# Basic packages for all instances
packages:
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - pollinate

# SSH root login configuration
ssh_pwauth: true
disable_root: false
write_files:
  - path: /etc/ssh/sshd_config.d/50-root-login.conf
    content: |
      PermitRootLogin yes
    owner: root:root
    permissions: '0644'

users:
  - name: root
    lock_passwd: false
    passwd: "$6$saltsalt$bAY90rAsHhyx.bxmKP9FE5UF4jP1iWgjV0ltM6ZJxfYkiIaCExjBZIbfmqmZEWoR65aM.1nFvG7fF3gYOjHpM."  # password: "root"

runcmd:
  - systemctl restart sshd